hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - +sweeper=optuna
  job:
    name: train
    chdir: null
    override_dirname: +sweeper=optuna
    id: ???
    num: ???
    config_name: train
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.2'
    cwd: /Users/choheekim/SynFS
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/choheekim/SynFS/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      sweeper: optuna
      mlflow: default
      optim: adam
      data: default
      model: synfs
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
seed: 0
nr_epochs: 20
device: cpu
model:
  views_dims:
  - 10
  - 10
  hidden_dims:
  - 32
  - 32
  output_dim: 2
  batch_norm: true
  dropout: true
  activation: relu
  learning_rate: 0.001
  s_learning_rate: 0.001
  weight_decay: 0.0001
  s_lam: 0.1
  ns_lam: 0.1
  ns_alpha: 0.2
  save_dir: ./checkpoints/
data:
  train_path: null
  val_path: null
  views_dims:
  - 10
  - 10
  batch_size: 64
  num_workers: 4
optim:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    weight_decay: 0.0001
mlflow:
  enabled: true
  experiment_name: default
sweeper:
  hydra:
    sweeper:
      _target_: hydra_plugins.hydra_optuna_sweeper.OptunaSweeper
      direction: maximize
      n_trials: 3
      sampler:
        _target_: optuna.samplers.TPESampler
        seed: 0
      params:
        model.learning_rate:
          distribution: loguniform
          low: 0.0001
          high: 0.01
        model.s_lam:
          distribution: uniform
          low: 0.01
          high: 1.0
        model.ns_alpha:
          distribution: uniform
          low: 0.0
          high: 0.5
